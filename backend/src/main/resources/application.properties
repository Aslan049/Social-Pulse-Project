spring.application.name=socialpulse
spring.datasource.url=jdbc:postgresql://localhost:15432/socialpulse
spring.datasource.username=socialpulse
spring.datasource.password=socialpulse

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# JWT (gerçek ortamda JWT_SECRET ortam değişkeni verilir; en az 32 karakter)
app.jwt.secret=${JWT_SECRET:gelistirme-ortami-icin-gizli-anahtar-0123456789}
app.jwt.expiration-minutes=120

app.cors.allowed-origins=http://localhost:5173